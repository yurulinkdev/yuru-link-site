name: YouTube initial collection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-initial-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-collector.txt
      - run: pip install -r scripts/requirements-collector.txt
      - name: Validate credentials
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$YOUTUBE_API_KEY" || { echo 'Missing YOUTUBE_API_KEY'; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo 'Missing GOOGLE_SERVICE_ACCOUNT_JSON'; exit 1; }
      - name: Collect YouTube metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BOOK1_SPREADSHEET_ID: 1je9Mxx1ogaGafIGBC0aNj45MtDByheDYQOzV8NfNty8
          BOOK2_SPREADSHEET_ID: 1f-p51EPAEltk8u6ewYbpD7gcuUWaDtcpQPJBN0hvdK4
        run: python scripts/collect_youtube_initial.py
