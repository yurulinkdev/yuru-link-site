name: Migrate YuruLink Book0-Book2
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write migration data (false = dry run)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: yurulink-sheets-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-collector.txt
      - run: pip install -r scripts/requirements-collector.txt
      - name: Authenticate via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Backfill sheets
        env:
          BOOK0_SPREADSHEET_ID: 1XDtUU1S36bgDqk-NkXkLXZlE_k8uUgwWVZ31IVcLihc
          BOOK1_SPREADSHEET_ID: 1je9Mxx1ogaGafIGBC0aNj45MtDByheDYQOzV8NfNty8
          BOOK2_SPREADSHEET_ID: 1f-p51EPAEltk8u6ewYbpD7gcuUWaDtcpQPJBN0hvdK4
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            echo "Direct Blue writes are disabled; use prepare-blue-green-migration.yml instead." >&2
            exit 1
          else
            python scripts/migrate_book0_book2.py --dry-run
          fi
