name: Prepare YuruLink Blue-Green migration
on:
  workflow_dispatch:
    inputs:
      prepare_green:
        description: 'Create Green copies and stage data (false = read-only plan)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: yurulink-sheets-migration
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-collector.txt
      - run: pip install -r scripts/requirements-collector.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p "test_prepare_blue_green_migration.py"\n      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Prepare Green (no activation)
        env:
          BOOK0_SPREADSHEET_ID: 1XDtUU1S36bgDqk-NkXkLXZlE_k8uUgwWVZ31IVcLihc
          BOOK1_SPREADSHEET_ID: 1je9Mxx1ogaGafIGBC0aNj45MtDByheDYQOzV8NfNty8
          BOOK2_SPREADSHEET_ID: 1f-p51EPAEltk8u6ewYbpD7gcuUWaDtcpQPJBN0hvdK4
          PREPARE_GREEN: ${{ inputs.prepare_green }}
        run: |
          if [ "$PREPARE_GREEN" = "true" ]; then
            python scripts/prepare_blue_green_migration.py --apply
          else
            python scripts/prepare_blue_green_migration.py
          fi
      - name: Save generation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-generation-manifest
          path: green-manifest.json
          if-no-files-found: ignore
          retention-days: 30
